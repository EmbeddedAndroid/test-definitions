metadata:
    format: Lava-Test Test Definition 1.0
    name: gpu-render
    description: "Headless GPU check: find a DRM render node, optionally
      bound to a given kernel driver, and run a render test that draws on
      the GPU and reads the pixels back, egl-readback by default. Without a
      render node the test is skipped; when the image has no GPU userspace
      (the render test command is missing) the render case is skipped."
    maintainer:
        - tyler.baker@oss.qualcomm.com
    os:
        - debian
        - ubuntu
        - fedora
        - openembedded
        - buildroot
    scope:
        - functional
    devices:
        - monaco-arduino-monza

params:
    # Kernel driver the render node's device must be bound to, e.g. msm_dpu;
    # empty accepts the first render node.
    DRIVER: ""
    # Render test command; it must exit 0 only if the GPU drew the
    # expected pixels.
    TEST_CMD: "egl-readback"

run:
    steps:
        - cd ./automated/linux/gpu-render/
        - ./gpu-render.sh -d "${DRIVER}" -c "${TEST_CMD}"
        - ../../utils/send-to-lava.sh ./output/result.txt
